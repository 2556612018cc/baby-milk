<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍼 宝宝喝奶记录台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 12px; color: #333; }
.container { max-width: 480px; margin: 0 auto; }
.header { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 12px; backdrop-filter: blur(10px); }
.header h1 { font-size: 24px; margin-bottom: 4px; }
.header .subtitle { font-size: 14px; color: #888; }
.header .status { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 12px; font-size: 12px; background: #e8f5e9; color: #2e7d32; }
.cards { display: flex; gap: 8px; margin-bottom: 12px; }
.card { flex: 1; background: rgba(255,255,255,0.95); border-radius: 16px; padding: 16px 8px; text-align: center; }
.card .icon { font-size: 24px; margin-bottom: 4px; }
.card .value { font-size: 22px; font-weight: bold; color: #667eea; }
.card .label { font-size: 11px; color: #999; margin-top: 2px; }
.progress-section { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.progress-bar { height: 20px; background: #eee; border-radius: 10px; overflow: hidden; margin: 8px 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 10px; transition: width 0.5s; }
.progress-text { font-size: 12px; color: #666; text-align: center; }
.identity-section { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 16px; margin-bottom: 12px; text-align: center; }
.identity-section h3 { margin-bottom: 12px; font-size: 16px; }
.identity-btns { display: flex; gap: 12px; justify-content: center; }
.id-btn { flex: 1; padding: 14px; border: 2px solid #eee; border-radius: 14px; background: white; font-size: 16px; cursor: pointer; transition: all 0.3s; }
.id-btn.selected { border-color: #667eea; background: #f0f0ff; transform: scale(1.02); }
.id-btn .emoji { font-size: 28px; display: block; margin-bottom: 4px; }
.input-section { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.input-section h3 { margin-bottom: 12px; font-size: 16px; }
.input-row { display: flex; gap: 8px; margin-bottom: 10px; }
.input-row input { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; }
.quick-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.quick-btn { padding: 8px 14px; border: 2px solid #eee; border-radius: 20px; background: white; font-size: 14px; cursor: pointer; }
.quick-btn:active { background: #667eea; color: white; border-color: #667eea; }
.night-toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; }
.night-toggle input { width: 20px; height: 20px; }
.remark-row { display: flex; gap: 6px; margin-bottom: 12px; }
.remark-btn { padding: 8px 10px; border: 2px solid #eee; border-radius: 10px; background: white; font-size: 14px; cursor: pointer; }
.remark-btn.selected { border-color: #667eea; background: #f0f0ff; }
.submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
.submit-btn:active { transform: scale(0.98); }
.list-section { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.list-section h3 { margin-bottom: 12px; font-size: 16px; }
.record-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.record-item:last-child { border-bottom: none; }
.record-left .time { font-weight: bold; font-size: 14px; }
.record-left .meta { font-size: 12px; color: #999; }
.record-right { display: flex; align-items: center; gap: 8px; }
.record-right .amount { font-weight: bold; color: #667eea; }
.record-right .delete { background: none; border: none; font-size: 18px; cursor: pointer; color: #ccc; }
.identity-tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 11px; margin-left: 6px; }
.tag-mom { background: #fce4ec; color: #e91e63; }
.tag-dad { background: #e3f2fd; color: #1976d2; }
.tag-night { background: #fff3e0; color: #f57c00; }
.week-section { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.week-section h3 { margin-bottom: 12px; font-size: 16px; }
.week-grid { display: flex; gap: 4px; margin-bottom: 12px; }
.week-day { flex: 1; text-align: center; padding: 8px 2px; border-radius: 8px; background: #f5f5f5; font-size: 11px; }
.week-day .day-label { color: #999; }
.week-day .day-amount { font-weight: bold; color: #667eea; margin-top: 2px; }
.week-table { width: 100%; font-size: 12px; border-collapse: collapse; }
.week-table th, .week-table td { padding: 6px; text-align: center; border-bottom: 1px solid #eee; }
.week-table th { color: #999; font-weight: normal; }
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.8); color: white; padding: 16px 24px; border-radius: 12px; font-size: 14px; z-index: 1000; display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🍼 宝宝喝奶记录台</h1>
    <div class="subtitle" id="greeting">记录每一口成长</div>
    <div class="status" id="status">☁️ 云端同步中</div>
  </div>

  <div class="cards">
    <div class="card"><div class="icon">📊</div><div class="value" id="totalAmount">0</div><div class="label">今日总量 (ml)</div></div>
    <div class="card"><div class="icon">🔢</div><div class="value" id="totalCount">0</div><div class="label">喝奶次数</div></div>
    <div class="card"><div class="icon">📏</div><div class="value" id="avgAmount">0</div><div class="label">平均每次 (ml)</div></div>
  </div>

  <div class="progress-section">
    <div style="font-size:14px;font-weight:bold;text-align:center;">📈 今日进度（参考 700ml）</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">0 / 700 ml</div>
  </div>

  <div class="identity-section" id="identitySection">
    <h3>👤 请选择你的身份</h3>
    <div class="identity-btns">
      <button class="id-btn" onclick="setIdentity('mom')"><span class="emoji">👩</span>妈妈</button>
      <button class="id-btn" onclick="setIdentity('dad')"><span class="emoji">👨</span>爸爸</button>
    </div>
  </div>

  <div class="input-section">
    <h3>➕ 记录喝奶</h3>
    <div class="input-row">
      <input type="time" id="timeInput" value="">
    </div>
    <div class="quick-btns">
      <button class="quick-btn" onclick="setAmount(120)">120ml</button>
      <button class="quick-btn" onclick="setAmount(150)">150ml</button>
      <button class="quick-btn" onclick="setAmount(180)">180ml</button>
      <button class="quick-btn" onclick="setAmount(210)">210ml</button>
      <button class="quick-btn" onclick="setAmount(240)">240ml</button>
    </div>
    <div class="input-row">
      <input type="number" id="amountInput" placeholder="奶量 (ml)" inputmode="numeric">
    </div>
    <label class="night-toggle">
      <input type="checkbox" id="nightInput"> 🌙 夜奶（凌晨 0:00–5:00 自动勾选）
    </label>
    <div class="remark-row">
      <button class="remark-btn" onclick="setRemark('😊好')">😊好</button>
      <button class="remark-btn" onclick="setRemark('💩便便好')">💩便便好</button>
      <button class="remark-btn" onclick="setRemark('😴睡得好')">😴睡得好</button>
      <button class="remark-btn" onclick="setRemark('🤮吐奶')">🤮吐奶</button>
      <button class="remark-btn" onclick="setRemark('😣哭闹')">😣哭闹</button>
    </div>
    <button class="submit-btn" onclick="addRecord()">✅ 记录</button>
  </div>

  <div class="list-section">
    <h3>📋 今日明细</h3>
    <div id="recordList"></div>
  </div>

  <div class="week-section">
    <h3>📅 最近 7 天</h3>
    <div class="week-grid" id="weekGrid"></div>
    <table class="week-table" id="weekTable"></table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://yrqdyzkqebyiyxgwsqal.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_vkoWNfnqFIpOCqPHPDM7yw_ls2ILGqC'

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
const TODAY = new Date().toISOString().slice(0, 10)
const REFERENCE = 700

let identity = localStorage.getItem('identity') || ''
let records = []
let remark = ''

document.getElementById('timeInput').value = new Date().toTimeString().slice(0,5)
if (identity) document.getElementById('identitySection').style.display = 'none'

const hour = new Date().getHours()
if (hour >= 0 && hour < 5) document.getElementById('nightInput').checked = true

const greetings = ['今天也要好好喝奶哦 💪','每一口都是成长的力量 🌟','记录小习惯，见证大成长 📝','宝宝的每一餐都值得被记住 🍼']
document.getElementById('greeting').textContent = greetings[Math.floor(Math.random()*greetings.length)]

async function loadRecords() {
  const { data, error } = await supabase.from('milk_logs').select('*').eq('date', TODAY).order('time', { ascending: false })
  if (error) { showToast('加载失败：'+error.message); return }
  records = data || []
  updateUI()
}

function updateUI() {
  const total = records.reduce((s,r)=>s+(r.amount||0),0)
  document.getElementById('totalAmount').textContent = total
  document.getElementById('totalCount').textContent = records.length
  document.getElementById('avgAmount').textContent = records.length ? Math.round(total/records.length) : 0
  const pct = Math.min(total/REFERENCE*100, 100)
  document.getElementById('progressFill').style.width = pct+'%'
  document.getElementById('progressText').textContent = `${total} / ${REFERENCE} ml${total>=REFERENCE?' 🎉':''}`
  const list = document.getElementById('recordList')
  list.innerHTML = records.map((r,i)=>`
    <div class="record-item">
      <div class="record-left">
        <div class="time">${r.time}</div>
        <div class="meta">${r.identity==='mom'?'👩 妈妈':'👨 爸爸'}${r.night?' <span class="tag-night">🌙夜奶</span>':''} ${r.remark||''}</div>
      </div>
      <div class="record-right">
        <span class="amount">${r.amount}ml</span>
        <button class="delete" onclick="deleteRecord('${r.id}')">✕</button>
      </div>
    </div>
  `).join('')
  updateWeek()
}

function updateWeek() {
  const grid = document.getElementById('weekGrid')
  const days = []
  for (let i=6;i>=0;i--) { const d=new Date();d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)) }
  grid.innerHTML = days.map(d=>{
    const dayRecords = records.filter(r=>r.date===d)
    const sum = dayRecords.reduce((s,r)=>s+(r.amount||0),0)
    const label = d===TODAY?'今':['日','一','二','三','四','五','六'][new Date(d).getDay()]
    return `<div class="week-day"><div class="day-label">${label}</div><div class="day-amount">${sum}ml</div></div>`
  }).join('')
}

function setIdentity(id) {
  identity = id
  localStorage.setItem('identity', id)
  document.querySelectorAll('.id-btn').forEach(b=>b.classList.remove('selected'))
  event.target.closest('.id-btn').classList.add('selected')
  setTimeout(()=>{ document.getElementById('identitySection').style.display='none' }, 300)
  showToast(id==='mom'?'👩 已设为妈妈':'👨 已设为爸爸')
}

function setAmount(v) { document.getElementById('amountInput').value = v }
function setRemark(v) {
  remark = v
  document.querySelectorAll('.remark-btn').forEach(b=>b.classList.remove('selected'))
  event.target.classList.add('selected')
}

async function addRecord() {
  if (!identity) { showToast('请先选择身份 👆'); document.getElementById('identitySection').style.display='block'; return }
  const time = document.getElementById('timeInput').value
  const amount = parseInt(document.getElementById('amountInput').value)
  if (!time || !amount) { showToast('请填时间和奶量'); return }
  const hour = parseInt(time.split(':')[0])
  const night = document.getElementById('nightInput').checked || (hour>=0 && hour<5)
  const { error } = await supabase.from('milk_logs').insert({ date: TODAY, time, amount, night, remark, identity })
  if (error) { showToast('记录失败：'+error.message); return }
  document.getElementById('amountInput').value=''
  remark=''
  document.querySelectorAll('.remark-btn').forEach(b=>b.classList.remove('selected'))
  document.getElementById('timeInput').value = new Date().toTimeString().slice(0,5)
  if (hour>=0 && hour<5) document.getElementById('nightInput').checked=true
  showToast('✅ 记录成功！')
  loadRecords()
}

async function deleteRecord(id) {
  if (!confirm('删除这条记录？')) return
  await supabase.from('milk_logs').delete().eq('id', id)
  showToast('已删除')
  loadRecords()
}

function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.style.display = 'block'
  setTimeout(()=>{ t.style.display='none' }, 2000)
}

supabase.channel('milk_logs_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'milk_logs' }, ()=>loadRecords()).subscribe()
loadRecords()
</script>
</body>
</html>
