<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝喂养记录</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f5f5;margin:0;padding:16px;color:#333}
h1{text-align:center;font-size:22px;margin:0 0 4px}
.sub{text-align:center;color:#888;font-size:13px;margin-bottom:14px}
.wrap{display:flex;gap:14px;align-items:flex-start;max-width:900px;margin:0 auto}
.sidebar{width:110px;flex-shrink:0;background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.tab{display:block;width:100%;text-align:left;padding:11px;border:none;border-radius:10px;background:#fafafa;cursor:pointer;font-size:14px;margin-bottom:8px}
.tab.active{background:#ff7eb3;color:#fff;font-weight:bold}
.main{flex:1;min-width:0}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.pane{display:none}.pane.active{display:block}
.title{font-size:18px;font-weight:bold;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:8px 12px;border-radius:8px;border:1px solid #ddd;background:#fafafa;cursor:pointer;font-size:14px}
.btn.active{background:#ff7eb3;color:#fff;border-color:#ff7eb3}
input.pad{padding:8px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.input-num{width:70px}.input-time{width:110px}.input-text{width:120px}.input-note{width:140px}
.record-btn{color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:16px;margin-top:10px;cursor:pointer;width:100%}
.stats{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}
.bar{height:10px;background:#eee;border-radius:5px;margin-top:8px;overflow:hidden}
.bar-fill{height:100%;background:#ff7eb3;transition:width .3s}
.log-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.del-btn{cursor:pointer;color:#999}
.empty{color:#aaa;text-align:center;padding:16px}
canvas{width:100%;max-width:760px;height:190px}
.legend{display:flex;gap:14px;font-size:13px;flex-wrap:wrap;margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.toggle{display:flex;gap:6px}
.toggle button{padding:6px 12px;border:1px solid #ff7eb3;background:#fff;color:#ff7eb3;border-radius:8px;cursor:pointer;font-size:13px}
.toggle button.active{background:#ff7eb3;color:#fff}
.day-detail{background:#fafafa;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
.day-detail b{color:#c2410c}
.remind{background:#fffbeb;border-left:4px solid #f59e0b;border-radius:6px;padding:8px 12px;margin-top:8px;font-size:13px;color:#92400e}
.remind.overdue{background:#fef2f2;border-left-color:#ef4444;color:#991b1b}
.note{font-size:12px;color:#666;margin-top:4px;font-style:italic}
.field-label{font-size:14px;color:#555;white-space:nowrap}
.field-label b{color:#c2410c}
.custom-int{width:70px}
.next-card{background:#e6f7ff;border:1px solid #91d5ff;border-radius:8px;padding:12px;margin-bottom:16px;text-align:center}
@media(max-width:600px){.wrap{flex-direction:column}.sidebar{width:100%;display:flex;flex-wrap:wrap}.tab{margin-bottom:0;flex:1;text-align:center;min-width:70px;padding:10px 4px;font-size:13px}}
</style>
</head>
<body>
<h1>🍼 宝宝喂养记录</h1>
<div class="sub">喝奶 · 喝水 · 拉屎 · 体检 · 疫苗</div>
<div class="wrap">
<div class="sidebar">
<button class="tab active" onclick="switchTab('milk',this)">🍼 喝奶</button>
<button class="tab" onclick="switchTab('water',this)">💧 喝水</button>
<button class="tab" onclick="switchTab('poop',this)">💩 拉屎</button>
<button class="tab" onclick="switchTab('checkup',this)">🩺 体检</button>
<button class="tab" onclick="switchTab('vaccine',this)">💉 疫苗</button>
</div>
<div class="main">
<div class="pane active" id="pane-milk">
<div class="card">
<div class="title">👶 宝宝信息</div>
<div class="row">
<span>出生日期：</span>
<input type="date" id="birthDate" class="pad" onchange="updateAge()">
</div>
<div style="margin-top:10px;font-size:15px">当前月龄：<strong id="ageText" style="color:#c2410c">—</strong>
<span style="font-size:13px;color:#888">｜<span id="adviceShort"></span></span>
</div>
</div>
<div class="card">
<div class="title">🍼 记录喝奶</div>
<div class="row"><span>身份：</span>
<button class="btn role-m active" onclick="setRole('milk','妈妈',this)">妈妈</button>
<button class="btn role-m" onclick="setRole('milk','爸爸',this)">爸爸</button>
</div>
<div class="row" style="margin-top:10px"><span>间隔：</span>
<button class="btn int-m" onclick="setInt('milk',0.5,this)">30分钟</button>
<button class="btn int-m active" onclick="setInt('milk',1,this)">1小时</button>
<button class="btn int-m" onclick="setInt('milk',2,this)">2小时</button>
<button class="btn int-m" onclick="setInt('milk',3,this)">3小时</button>
<input type="number" id="milkCustomInt" class="input-num pad custom-int" placeholder="自定义" step="0.5" min="0.5">
<button class="btn" onclick="setCustomInt('milk')">自定义(h)</button>
</div>
<div class="row" style="margin-top:10px">
<input type="number" id="milkAmount" class="input-num pad" value="120" placeholder="ml">
<input type="time" id="milkTime" class="input-time pad">
</div>
<button class="record-btn" style="background:#ff7eb3" onclick="record('milk')">记录喝奶</button>
<div id="nextCard-milk" class="next-card" style="display:none">
<div style="font-weight:bold">⏰ 下次喂奶：<span id="nextTime-milk"></span></div>
<div id="nextDesc-milk" style="font-size:13px;color:#555"></div>
</div>
<div class="stats">
<span>该日总量：<strong id="milkTotal">0</strong>ml</span>
<span>次数：<strong id="milkCount">0</strong></span>
<span>平均：<strong id="milkAvg">0</strong>ml</span>
</div>
<div class="bar"><div class="bar-fill" id="milkBar" style="width:0%"></div></div>
<div style="text-align:center;font-size:12px;color:#888;margin-top:5px" id="milkProgress">0 / 700 ml</div>
</div>
<div class="card">
<div class="title">📋 <span id="milkDateLabel"></span> 喝奶记录</div>
<div id="milkList"></div>
</div>
<div class="card chart-card">
<div class="toolbar">
<div class="toggle">
<button id="weekBtn" class="active" onclick="setRange('week')">最近一周</button>
<button id="monthBtn" onclick="setRange('month')">最近一个月</button>
</div>
</div>
<div class="legend"><span><i class="dot bm"></i>喝奶(ml)</span><span><i class="dot bw"></i>喝水(ml)</span><span><i class="dot" style="background:#a78bfa;border-radius:50%"></i>拉屎(次)</span></div>
<canvas id="chartLine"></canvas>
<div class="day-detail" id="dayDetail"></div>
</div>
</div>
<div class="pane" id="pane-water">
<div class="card">
<div class="title">💧 记录喝水</div>
<div class="row"><span>身份：</span>
<button class="btn role-w active" onclick="setRole('water','妈妈',this)">妈妈</button>
<button class="btn role-w" onclick="setRole('water','爸爸',this)">爸爸</button>
</div>
<div class="row" style="margin-top:10px"><span>间隔：</span>
<button class="btn int-w active" onclick="setInt('water',0.5,this)">30分钟</button>
<button class="btn int-w" onclick="setInt('water',1,this)">1小时</button>
<button class="btn int-w" onclick="setInt('water',2,this)">2小时</button>
<button class="btn int-w" onclick="setInt('water',3,this)">3小时</button>
<input type="number" id="waterCustomInt" class="input-num pad custom-int" placeholder="自定义" step="0.5" min="0.5">
<button class="btn" onclick="setCustomInt('water')">自定义(h)</button>
</div>
<div class="row" style="margin-top:10px">
<input type="number" id="waterAmount" class="input-num pad" value="60" placeholder="ml">
<input type="time" id="waterTime" class="input-time pad">
</div>
<button class="record-btn" style="background:#38bdf8" onclick="record('water')">记录喝水</button>
<div id="nextCard-water" class="next-card" style="display:none">
<div style="font-weight:bold">⏰ 下次喝水：<span id="nextTime-water"></span></div>
<div id="nextDesc-water" style="font-size:13px;color:#555"></div>
</div>
<div class="stats">
<span>该日总量：<strong id="waterTotal">0</strong>ml</span>
<span>次数：<strong id="waterCount">0</strong></span>
<span>平均：<strong id="waterAvg">0</strong>ml</span>
</div>
<div class="bar"><div class="bar-fill" id="waterBar" style="width:0%;background:#38bdf8"></div></div>
<div style="text-align:center;font-size:12px;color:#888;margin-top:5px" id="waterProgress">0 / 300 ml</div>
</div>
<div class="card">
<div class="title">📋 <span id="waterDateLabel"></span> 喝水记录</div>
<div id="waterList"></div>
</div>
</div>
<div class="pane" id="pane-poop">
<div class="card">
<div class="title">💩 记录拉屎</div>
<div class="row">
<input type="number" id="poopCount" class="input-num pad" value="1" min="1" placeholder="次数">
<input type="time" id="poopTime" class="input-time pad">
<button class="btn role-p active" onclick="setRole('poop','妈妈',this)">妈妈</button>
<button class="btn role-p" onclick="setRole('poop','爸爸',this)">爸爸</button>
</div>
<button class="record-btn" style="background:#a78bfa" onclick="record('poop')">记录拉屎</button>
</div>
<div class="card">
<div class="title">📋 <span id="poopDateLabel"></span> 拉屎记录</div>
<div id="poopList"></div>
</div>
</div>
<div class="pane" id="pane-checkup">
<div class="card">
<div class="title">🩺 记录体检</div>
<div class="row">
<input type="text" id="checkName" class="input-text pad" placeholder="体检项目">
<input type="date" id="checkDate" class="pad">
</div>
<div class="row" style="margin-top:10px">
<span class="field-label"><b>*下次时间</b></span>
<input type="date" id="checkNext" class="pad">
<span class="field-label"><b>*备注</b></span>
<input type="text" id="checkNote" class="input-note pad" placeholder="注意事项">
<button class="btn role-c active" onclick="setRole('checkup','妈妈',this)">妈妈</button>
<button class="btn role-c" onclick="setRole('checkup','爸爸',this)">爸爸</button>
</div>
<button class="record-btn" style="background:#14b8a6" onclick="recordCheck('checkup')">保存体检</button>
</div>
<div class="card">
<div class="title">📋 体检记录</div>
<div id="checkupList"></div>
</div>
</div>
<div class="pane" id="pane-vaccine">
<div class="card">
<div class="title">💉 记录疫苗</div>
<div class="row">
<input type="text" id="vacName" class="input-text pad" placeholder="疫苗名称">
<input type="date" id="vacDate" class="pad">
</div>
<div class="row" style="margin-top:10px">
<span class="field-label"><b>*下次时间</b></span>
<input type="date" id="vacNext" class="pad">
<span class="field-label"><b>*备注</b></span>
<input type="text" id="vacNote" class="input-note pad" placeholder="注意事项">
<button class="btn role-v active" onclick="setRole('vaccine','妈妈',this)">妈妈</button>
<button class="btn role-v" onclick="setRole('vaccine','爸爸',this)">爸爸</button>
</div>
<button class="record-btn" style="background:#f43f5e" onclick="recordCheck('vaccine')">保存疫苗</button>
</div>
<div class="card">
<div class="title">📋 疫苗记录</div>
<div id="vaccineList"></div>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== Supabase 配置（已填好）=====
const SUPABASE_URL = 'https://yrqdyzkqebyiyxgwsqal.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlycWR5emtxZWJ5aXl4Z3dzcWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTczMjgsImV4cCI6MjEwNTY5MzMyOH0.Q6i92tAnz0uaPW2M8lXd_Fpi6GByeSC4zgSHTydfoLA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== 状态 =====
let logs={milk:[],water:[],poop:[],checkup:[],vaccine:[]};
let role={milk:'妈妈',water:'妈妈',poop:'妈妈',checkup:'妈妈',vaccine:'妈妈'};
let intv={milk:1,water:0.5};
let selectedDate=new Date().toISOString().split('T')[0];
let range='week';
let babyAgeDays=0;

const ADVICE={
newborn:'0–1月龄按需喂养，每日约 8–12 次',
m1:'1–2月龄约 6–8 次，单次 90–120 ml',
m2:'2–3月龄约 6 次，单次 120–150 ml',
m3:'3–4月龄约 5–6 次，单次 150–180 ml',
m4:'4–6月龄约 5 次，单次 180–210 ml，可逐步加辅食',
m6:'6–9月龄奶量约 600–800 ml/日，辅食 1–2 顿',
m9:'9–12月龄奶量约 500–700 ml/日，辅食 2–3 顿',
m12:'1–2岁每日奶量约 400–500 ml，三餐两点',
big:'2岁以上每日奶量约 300–500 ml，三餐规律'
};

// ===== 云端读写 =====
async function loadAll() {
  try {
    const [milk, water, poop, checkup, vaccine] = await Promise.all([
      sb.from('milk_logs').select('*').order('created_at', { ascending: false }),
      sb.from('water_logs').select('*').order('created_at', { ascending: false }),
      sb.from('poop_logs').select('*').order('created_at', { ascending: false }),
      sb.from('checkup_logs').select('*').order('created_at', { ascending: false }),
      sb.from('vaccine_logs').select('*').order('created_at', { ascending: false })
    ]);
    if (milk.data && milk.data.length) logs.milk = milk.data;
    if (water.data && water.data.length) logs.water = water.data;
    if (poop.data && poop.data.length) logs.poop = poop.data;
    if (checkup.data && checkup.data.length) logs.checkup = checkup.data;
    if (vaccine.data && vaccine.data.length) logs.vaccine = vaccine.data;
    console.log('✅ 云端数据加载成功');
  } catch(e) {
    console.warn('云端加载失败，使用本地数据', e);
    const s = localStorage.getItem('baby_logs');
    if (s) try { logs = JSON.parse(s); } catch(e) {}
  }
  // 兜底：云端没数据时用本地测试数据
  if (logs.milk.length === 0) {
    for(let i=0;i<5;i++){
      const d=new Date(Date.now()-i*86400000).toISOString().split('T')[0];
      logs.milk.push({date:d,role:'妈妈',ml:120,time:'08:00',interval:'1h'});
      logs.milk.push({date:d,role:'妈妈',ml:150,time:'11:00',interval:'1h'});
      logs.water.push({date:d,role:'妈妈',ml:60,time:'10:00',interval:'0.5h'});
      if(i<3)logs.poop.push({date:d,role:'妈妈',count:1,time:'09:00'});
    }
    logs.checkup.push({date:todayStr(),name:'满月体检',role:'妈妈',next:null,note:'带好保健手册'});
    logs.vaccine.push({date:todayStr(),name:'乙肝第2针',role:'妈妈',next:null,note:'接种后留观30分钟'});
  }
}

async function saveRemote(type, item) {
  const tableMap = { milk: 'milk_logs', water: 'water_logs', poop: 'poop_logs', checkup: 'checkup_logs', vaccine: 'vaccine_logs' };
  try { await sb.from(tableMap[type]).insert(item); } catch(e) { console.warn('写入失败', e); }
}

async function delRemote(type, id) {
  const tableMap = { milk: 'milk_logs', water: 'water_logs', poop: 'poop_logs', checkup: 'checkup_logs', vaccine: 'vaccine_logs' };
  try { await sb.from(tableMap[type]).delete().eq('id', id); } catch(e) { console.warn('删除失败', e); }
}

async function loadRemoteAfter(type) {
  const tableMap = { milk: 'milk_logs', water: 'water_logs', poop: 'poop_logs', checkup: 'checkup_logs', vaccine: 'vaccine_logs' };
  try { const r = await sb.from(tableMap[type]).select('*').order('created_at', { ascending: false }); if (r.data) logs[type] = r.data; } catch(e) {}
}

async function saveProfile() {
  const b = document.getElementById('birthDate').value;
  if (!b) return;
  try {
    const { data } = await sb.from('baby_profile').select('id').eq('id', 1);
    if (data && data.length) { await sb.from('baby_profile').update({ birth_date: b }).eq('id', 1); }
    else { await sb.from('baby_profile').insert({ id: 1, birth_date: b }); }
  } catch(e) {}
  localStorage.setItem('baby_birth', b);
}

async function loadProfile() {
  try {
    const { data } = await sb.from('baby_profile').select('birth_date').eq('id', 1).single();
    if (data && data.birth_date) { document.getElementById('birthDate').value = data.birth_date; updateAge(true); }
  } catch(e) {
    const savedB = localStorage.getItem('baby_birth');
    if (savedB) { document.getElementById('birthDate').value = savedB; updateAge(); }
  }
}

// ===== 工具函数 =====
function todayStr(){return new Date().toISOString().split('T')[0];}
function fullLabel(ds){return ds===todayStr()?'今天':ds;}
function daysInRange(){const a=[];const n=range==='week'?7:30;for(let i=n-1;i>=0;i--){const d=new Date(Date.now()-i*86400000);a.push(d.toISOString().split('T')[0]);}return a;}
function nowTime(){const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
function calcNext(t,h){const [hh,mm]=t.split(':').map(Number);const d=new Date();d.setHours(hh,mm,0,0);d.setTime(d.getTime()+h*3600000);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function daysUntil(ds){return Math.ceil((new Date(ds)-new Date(todayStr()))/86400000);}
function intLabel(h){return h<1?(h*60+'分钟'):(h+'小时');}
function updateAge(silent){
  const b=document.getElementById('birthDate').value;
  if(!b)return;
  babyAgeDays=Math.max(0,Math.floor((new Date()-new Date(b))/86400000));
  const m=Math.floor(babyAgeDays/30),d=babyAgeDays%30;
  document.getElementById('ageText').innerText=`${m} 月龄 ${d} 天`;
  document.getElementById('adviceShort').innerText=ADVICE[ageBand()];
  saveProfile();
}
function ageBand(){
  const m=Math.floor(babyAgeDays/30);
  if(babyAgeDays<30)return 'newborn';
  if(m<2)return 'm1';if(m<3)return 'm2';if(m<4)return 'm3';if(m<6)return 'm4';
  if(m<9)return 'm6';if(m<12)return 'm9';if(m<24)return 'm12';
  return 'big';
}
function switchTab(name,el){
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(name==='milk'||name==='water'||name==='poop')drawLine();
}
function setRole(type,r,el){
  role[type]=r;
  document.querySelectorAll('.role-'+type[0]).forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}
function setInt(type,h,el){
  intv[type]=h;
  document.querySelectorAll('.int-'+type[0]).forEach(b=>{b.classList.remove('active');b.style.background='';b.style.color='';});
  el.classList.add('active');el.style.background='#ff7eb3';el.style.color='#fff';
  document.getElementById(type+'CustomInt').value='';
}
function setCustomInt(type){
  const v=parseFloat(document.getElementById(type+'CustomInt').value);
  if(!v||v<=0)return alert('请输入有效间隔（小时）');
  intv[type]=v;
  document.querySelectorAll('.int-'+type[0]).forEach(b=>{b.classList.remove('active');b.style.background='';b.style.color='';});
}
function setRange(r){
  range=r;
  document.getElementById('weekBtn').classList.toggle('active',r==='week');
  document.getElementById('monthBtn').classList.toggle('active',r==='month');
  drawLine();
}
async function record(type){
  let item;
  if(type==='milk'){
    const ml=parseInt(document.getElementById('milkAmount').value);
    if(!ml||ml<=0)return alert('请输入有效奶量');
    const t=document.getElementById('milkTime').value||nowTime();
    item={date:selectedDate,role:role.milk,ml,time:t,interval:intLabel(intv.milk)};
    document.getElementById('nextCard-milk').style.display='block';
    document.getElementById('nextTime-milk').innerText=calcNext(t,intv.milk);
    document.getElementById('nextDesc-milk').innerText=`距上次约 ${intLabel(intv.milk)}（${t} → ${calcNext(t,intv.milk)}）`;
    document.getElementById('milkTime').value='';
  }else if(type==='water'){
    const ml=parseInt(document.getElementById('waterAmount').value);
    if(!ml||ml<=0)return alert('请输入有效水量');
    const t=document.getElementById('waterTime').value||nowTime();
    item={date:selectedDate,role:role.water,ml,time:t,interval:intLabel(intv.water)};
    document.getElementById('nextCard-water').style.display='block';
    document.getElementById('nextTime-water').innerText=calcNext(t,intv.water);
    document.getElementById('nextDesc-water').innerText=`距上次约 ${intLabel(intv.water)}（${t} → ${calcNext(t,intv.water)}）`;
    document.getElementById('waterTime').value='';
  }else{
    const c=parseInt(document.getElementById('poopCount').value)||1;
    const t=document.getElementById('poopTime').value||nowTime();
    item={date:selectedDate,role:role.poop,count:c,time:t};
    document.getElementById('poopTime').value='';
  }
  await saveRemote(type, item);
  await loadRemoteAfter(type);
  localStorage.setItem('baby_logs', JSON.stringify(logs));
  renderAll();
}
async function recordCheck(type){
  const isC=type==='checkup';
  const name=document.getElementById(isC?'checkName':'vacName').value.trim();
  const dateVal=document.getElementById(isC?'checkDate':'vacDate').value||todayStr();
  const nextVal=document.getElementById(isC?'checkNext':'vacNext').value;
  const note=document.getElementById(isC?'checkNote':'vacNote').value.trim();
  if(!name)return alert('请填写'+(isC?'体检项目':'疫苗名称'));
  const item={date:dateVal,name,role:role[type],next:nextVal||null,note};
  await saveRemote(type, item);
  await loadRemoteAfter(type);
  localStorage.setItem('baby_logs', JSON.stringify(logs));
  document.getElementById(isC?'checkName':'vacName').value='';
  document.getElementById(isC?'checkNext':'vacNext').value='';
  document.getElementById(isC?'checkNote':'vacNote').value='';
  renderAll();
}
async function del(type,i){
  const rec=logs[type][i];
  if(rec&&rec.id)await delRemote(type,rec.id);
  logs[type].splice(i,1);
  localStorage.setItem('baby_logs',JSON.stringify(logs));
  renderAll();
}
function renderAll(){
  renderType('milk',700);renderType('water',300);
  renderMilkList();renderWaterList();
  renderPoopList();renderCheckList('checkup');renderCheckList('vaccine');
  drawLine();
}
function renderType(type,goal){
  const day=logs[type].filter(l=>l.date===selectedDate);
  const total=day.reduce((s,l)=>s+(l.ml||0),0),count=day.length,avg=count?Math.round(total/count):0;
  document.getElementById(type+'Total').innerText=total;
  document.getElementById(type+'Count').innerText=count;
  document.getElementById(type+'Avg').innerText=avg;
  document.getElementById(type+'Bar').style.width=Math.min(total/goal*100,100)+'%';
  document.getElementById(type+'Progress').innerText=`${total} / ${goal} ml`;
  document.getElementById(type+'DateLabel').innerText=fullLabel(selectedDate);
}
function renderMilkList(){
  document.getElementById('milkDateLabel').innerText=fullLabel(selectedDate);
  const day=logs.milk.filter(l=>l.date===selectedDate).sort((a,b)=>b.time.localeCompare(a.time));
  if(!day.length){document.getElementById('milkList').innerHTML='<div class="empty">该日暂无喝奶记录</div>';return;}
  document.getElementById('milkList').innerHTML=day.map(l=>`
  <div class="log-item">
  <div>🍼 <strong>${l.ml}ml</strong> <span style="font-size:13px;color:#888">${l.role} · ${l.time} · 间隔${l.interval||''}</span></div>
  <span class="del-btn" onclick="del('milk',${logs.milk.indexOf(l)})">🗑️</span>
  </div>
  `).join('');
}
function renderWaterList(){
  document.getElementById('waterDateLabel').innerText=fullLabel(selectedDate);
  const day=logs.water.filter(l=>l.date===selectedDate).sort((a,b)=>b.time.localeCompare(a.time));
  if(!day.length){document.getElementById('waterList').innerHTML='<div class="empty">该日暂无喝水记录</div>';return;}
  document.getElementById('waterList').innerHTML=day.map(l=>`
  <div class="log-item">
  <div>💧 <strong>${l.ml}ml</strong> <span style="font-size:13px;color:#888">${l.role} · ${l.time} · 间隔${l.interval||''}</span></div>
  <span class="del-btn" onclick="del('water',${logs.water.indexOf(l)})">🗑️</span>
  </div>
  `).join('');
}
function renderPoopList(){
  document.getElementById('poopDateLabel').innerText=fullLabel(selectedDate);
  const day=logs.poop.filter(l=>l.date===selectedDate).sort((a,b)=>b.time.localeCompare(a.time));
  document.getElementById('poopList').innerHTML=day.length?day.map(l=>`<div class="log-item"><div>💩 <strong>${l.count}次</strong> <span style="font-size:13px;color:#888">${l.role}·${l.time}</span></div><span class="del-btn" onclick="del('poop',${logs.poop.indexOf(l)})">🗑️</span></div>`).join(''):'<div class="empty">该日暂无拉屎记录</div>';
}
function renderCheckList(type){
  const list=logs[type].slice().sort((a,b)=>b.date.localeCompare(a.date));
  const box=document.getElementById(type+'List');
  if(!list.length){box.innerHTML='<div class="empty">暂无记录</div>';return;}
  box.innerHTML=list.map(l=>{
    let tip='';
    if(l.next){
      const left=daysUntil(l.next);
      const cls=left<0?'overdue':'';
      const txt=left<0?`已逾期 ${-left} 天`:(left===0?'就是今天':`还有 ${left} 天`);
      tip=`<div class="remind ${cls}">⏰ 下次预约：<b>${l.next}</b>（${txt}）</div>`;
    }
    const noteHtml=l.note?`<div class="note">📝 ${l.note}</div>`:'';
    return `<div class="log-item"><div><div><strong>${l.name}</strong></div><div style="font-size:13px;color:#888">${l.role} · ${l.date}</div>${noteHtml}</div><span class="del-btn" onclick="del('${type}',${logs[type].indexOf(l)})">🗑️</span></div>${tip}`;
  }).join('');
}
function drawLine(){
  if(!document.getElementById('pane-milk').classList.contains('active')&&
  !document.getElementById('pane-water').classList.contains('active')&&
  !document.getElementById('pane-poop').classList.contains('active'))return;
  const days=daysInRange();
  const cv=document.getElementById('chartLine'),ctx=cv.getContext('2d');
  const W=cv.width=760,H=cv.height=190;ctx.clearRect(0,0,W,H);
  const milk=days.map(ds=>logs.milk.filter(l=>l.date===ds).reduce((s,l)=>s+(l.ml||0),0));
  const water=days.map(ds=>logs.water.filter(l=>l.date===ds).reduce((s,l)=>s+(l.ml||0),0));
  const poop=days.map(ds=>logs.poop.filter(l=>l.date===ds).reduce((s,l)=>s+(l.count||0),0));
  const max=Math.max(700,...milk,...water),maxP=Math.max(1,...poop);
  const pad=44,gap=W/Math.max(days.length+1,2);
  ctx.strokeStyle='#eee';ctx.beginPath();ctx.moveTo(pad,10);ctx.lineTo(pad,H-30);ctx.lineTo(W-10,H-30);ctx.stroke();
  function series(data,color,mx){
    ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();
    data.forEach((v,i)=>{const x=pad+gap*(i+1),y=H-30-(v/mx)*(H-50);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
    data.forEach((v,i)=>{const x=pad+gap*(i+1),y=H-30-(v/mx)*(H-50);
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();
    ctx.fillStyle='#333';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(v,x,y-9);});
  }
  series(milk,'#ff7eb3',max);series(water,'#38bdf8',max);series(poop,'#a78bfa',maxP);
  days.forEach((ds,i)=>{const x=pad+gap*(i+1);ctx.fillStyle=ds===selectedDate?'#c2410c':'#888';ctx.font=(ds===selectedDate?'bold ':'')+'11px sans-serif';ctx.textAlign='center';ctx.fillText(ds.slice(5),x,H-14);});
  const m=logs.milk.filter(l=>l.date===selectedDate).reduce((s,l)=>s+(l.ml||0),0);
  const mc=logs.milk.filter(l=>l.date===selectedDate).length;
  const w=logs.water.filter(l=>l.date===selectedDate).reduce((s,l)=>s+(l.ml||0),0);
  const wc=logs.water.filter(l=>l.date===selectedDate).length;
  const p=logs.poop.filter(l=>l.date===selectedDate).reduce((s,l)=>s+(l.count||0),0);
  document.getElementById('dayDetail').innerHTML=
  `<span><b>${fullLabel(selectedDate)}</b></span><span>🍼 喝奶 <b>${m}ml</b>/${mc}次</span><span>💧 喝水 <b>${w}ml</b>/${wc}次</span><span>💩 拉屎 <b>${p}次</b></span>`;
}

// ===== 启动 =====
(async()=>{
  await loadAll();
  await loadProfile();
  renderAll();
  console.log('✅ 宝宝记录启动完成，云端同步已开启');
})();
</script>
